[mod]
id = "computercraft"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure Lua subset and the terminal (standalone crate lib, injected as
# `crate::game::computercraft`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "computercraft"
source = "runtime.rs"

# Game-side glue: the block entity's state, the terminal, the commands, the
# screen.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "computercraft_state"
source = "support.rs"

# The content half is inside this bundle (`data/computercraft-content.hmod`,
# the built `content/computercraft.hmod`): this writes it to `.horizon-cache/`
# and appends it to the dev-mod list, so one `.hnmod` installs the computer
# block and the code (the AE2 pattern; the registry keeps one file per project).
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# A computer block gets a block entity holding the program and terminal.
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... which ticks, so a placed program runs.
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# Clients get the terminal lines (API 45), and draw them (API 71).
[[injection]]
id = "block-entity-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "block_entity_update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "tag" },
]

[[injection]]
id = "block-entity-submit"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "block_entity_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "draw" },
]

# A placed computer faces the player (API 76).
[[injection]]
id = "state-for-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "context", ty = "&horizon_world::level::PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<horizon_world::registry::BlockStateId>>", value = "answer" },
]

# `/computercraft load|run|screen|power` (API 8).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
